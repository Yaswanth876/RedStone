global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # Local development scrape target
  - job_name: "redstone-api-local"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:4000", "localhost:4000"]
        labels:
          environment: "development"
          service: "redstone-backend"

  # Production Render deployed scrape target (replace host with your Render app domain)
  - job_name: "redstone-api-render"
    scrape_interval: 15s
    scheme: "https"
    metrics_path: "/metrics"
    # If METRICS_TOKEN is set on Render, uncomment the bearer_token line or pass via header
    # bearer_token: "YOUR_METRICS_TOKEN"
    static_configs:
      - targets: ["redstone-api.onrender.com"]
        labels:
          environment: "production"
          service: "redstone-backend"

# Optional: Grafana Cloud remote_write integration
# remote_write:
#   - url: "<Your Grafana Cloud Prometheus remote_write URL>"
#     basic_auth:
#       username: "<Your Grafana Cloud Prometheus Instance ID>"
#       password: "<Your Grafana Cloud Access Policy Token>"
