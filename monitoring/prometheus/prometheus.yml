global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # Containerized backend target
  - job_name: "redstone-api-docker"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:4000"]
        labels:
          environment: "docker"
          service: "redstone-backend"

  # Local host scrape target fallback
  - job_name: "redstone-api-host"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          environment: "development"
          service: "redstone-backend"

  # Production Render deployed scrape target
  - job_name: "redstone-api-render"
    scrape_interval: 15s
    scheme: "https"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["redstone-ugwp.onrender.com"]
        labels:
          environment: "production"
          service: "redstone-backend"
