services:
  - type: web
    name: redstone-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: redstone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
      - key: JSON_BODY_LIMIT
        value: 1mb
      - key: UPLOAD_MAX_BYTES
        value: 10485760

databases:
  - name: redstone-db
    databaseName: redstone
    user: redstone_user
    plan: free
    region: oregon
